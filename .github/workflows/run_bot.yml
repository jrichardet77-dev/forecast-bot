# Runs the bot on a schedule. Inert until the owner adds the METACULUS_TOKEN and OPENROUTER_API_KEY secrets.
# Submitting is a separate switch: the repository variable BOT_PUBLISH must equal "yes" (owner approval required).
# Cost: GitHub Actions is free for public repositories; a private repository gets 2,000 free minutes a month and
# simply stops (no charge) at the limit unless a payment method and spending limit are added. Do not add one.
name: Forecast
on:
  schedule:
    - cron: "*/30 * * * *"   # questions stay open 3 hours, so every 30 minutes sees each one several times
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual runs use only the unscored test area and never submit (previewing live tournament questions is against the rules)"
        default: test_questions
        type: choice
        options: [test_questions]
concurrency:
  group: forecast
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  forecast:
    # Scheduled runs need the BOT_ENABLED switch; a manual test run is always allowed and never submits.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Forecast open tournament questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          BOT_MODELS: ${{ vars.BOT_MODELS }}
          BOT_PUBLISH: ${{ github.event_name == 'schedule' && vars.BOT_PUBLISH || 'no' }}
        run: python bot/run.py --mode ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'tournament' }}
      - name: Save the forecast log
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "noreply@github.com"
          for f in data/official.csv data/test-runs.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Forecast log" && git push)
